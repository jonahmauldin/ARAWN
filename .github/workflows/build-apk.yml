name: Build ARAWN APK

# Builds a debug APK in the cloud (no local Android SDK needed) and publishes
# it as a GitHub Release so it can be downloaded + sideloaded straight onto a
# phone. Triggers on every push to main, or manually from the Actions tab.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # needed to create the Release

jobs:
  build:
    runs-on: ubuntu-latest
    # A1: stable signing credentials. Surfaced as job-level env so the build step
    # (and the conditional decode step) can read them. When the secrets are not
    # configured these are empty strings and the build falls back to debug signing.
    env:
      ARAWN_KEYSTORE_BASE64: ${{ secrets.ARAWN_KEYSTORE_BASE64 }}
      ARAWN_KEYSTORE_PASSWORD: ${{ secrets.ARAWN_KEYSTORE_PASSWORD }}
      ARAWN_KEY_ALIAS: ${{ secrets.ARAWN_KEY_ALIAS }}
      ARAWN_KEY_PASSWORD: ${{ secrets.ARAWN_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # A1: decode the base64 keystore secret to a file and expose its path.
      # Skipped automatically when the secret is absent (debug-signing fallback).
      - name: Decode signing keystore
        if: ${{ env.ARAWN_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ARAWN_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/arawn-stable.jks"
          echo "ARAWN_KEYSTORE_PATH=$RUNNER_TEMP/arawn-stable.jks" >> "$GITHUB_ENV"

      - name: Report signing mode
        run: |
          if [ -n "$ARAWN_KEYSTORE_PATH" ]; then
            echo "Signing with STABLE key: $ARAWN_KEYSTORE_PATH"
          else
            echo "No stable keystore configured — falling back to per-build DEBUG signing."
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug -Pbuild_number=${{ github.run_number }} --stacktrace --no-daemon

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: arawn-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish APK to a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ARAWN debug build ${{ github.run_number }}
          body: |
            Automated debug APK for on-device testing.
            Download `app-debug.apk` below and tap it on the phone to install.
          files: app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: true
